name: Build Bot TradeFX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Bot TradeFX APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BotTradeFX.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotTradeFX-APK
          path: release-output/BotTradeFX.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: "⚡ Bot TradeFX v2.5.0 (File APK Siap Pasang)"
          body: |
            ## 📱 Unduh File APK Bot TradeFX
            Klik berkas **BotTradeFX.apk** di bawah ini untuk mengunduh dan memasang aplikasi langsung di ponsel Android Anda.

            - **Nama Aplikasi**: Bot TradeFX
            - **Versi**: 2.5.0
            - **Format**: File .apk Android Asli
            - **Fitur**: Auto Open Posisi Binary Options Real-Time (Tanpa Candlestick)
          files: release-output/BotTradeFX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
